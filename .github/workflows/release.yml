name: Windows Release Candidate

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      QT_QPA_PLATFORM: offscreen
      SCOPE_ZERO_SPAN_DATA_DIR: ${{ github.workspace }}/build/source-test-user-data
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Python bootstrap
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.2'
      - name: Set up pinned Windows Python
        run: |
          uv venv .venv-release --python 3.11.15 --managed-python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Resolve-Path .venv-release/Scripts).Path >> $env:GITHUB_PATH
      - name: Generate version and product metadata
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          if ($env:RELEASE_TAG) { python packaging/windows_metadata.py --tag $env:RELEASE_TAG }
          else { python packaging/windows_metadata.py }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install pinned build dependencies
        run: |
          uv pip install --python .venv-release/Scripts/python.exe --require-hashes -r packaging/requirements-windows.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip install --python .venv-release/Scripts/python.exe --no-deps --no-build-isolation -e .
      - name: Compile
        run: python -m compileall -q src tests packaging
      - name: Source pytest
        run: python -m pytest -q --durations=20
      - name: Collect third-party notices
        run: python packaging/collect_notices.py
      - name: Build Windows EXE
        run: python -m PyInstaller --noconfirm --clean packaging/ScopeZeroSpanConverter.spec
      - name: Sign application (optional)
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./packaging/windows/sign.ps1 -Path dist/ScopeZeroSpanConverter/ScopeZeroSpanConverter.exe
      - name: Packaged EXE smoke
        run: ./packaging/windows/verify.ps1 -Stage exe
      - name: Build portable ZIP
        run: |
          $meta = Get-Content build/packaging/metadata.json -Raw | ConvertFrom-Json
          New-Item -ItemType Directory -Force dist/artifacts | Out-Null
          Copy-Item README.md,CHANGELOG.md,THIRD_PARTY_NOTICES.md dist/ScopeZeroSpanConverter/
          Copy-Item docs dist/ScopeZeroSpanConverter/docs -Recurse
          Copy-Item configs dist/ScopeZeroSpanConverter/configs -Recurse
          Compress-Archive -Path dist/ScopeZeroSpanConverter -DestinationPath "dist/artifacts/$($meta.portable_filename)"
          if ((Get-Item "dist/artifacts/$($meta.portable_filename)").Length -le 0) { throw 'Empty ZIP' }
      - name: Install Inno Setup
        run: ./packaging/windows/install-inno.ps1
      - name: Build Installer
        run: |
          & $env:INNO_COMPILER packaging/windows/ScopeZeroSpanConverter.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sign installer (optional)
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $meta = Get-Content build/packaging/metadata.json -Raw | ConvertFrom-Json
          ./packaging/windows/sign.ps1 -Path "dist/artifacts/$($meta.installer_filename)"
      - name: Silent install, installed EXE smoke and uninstall
        run: ./packaging/windows/verify.ps1 -Stage installer
      - name: Checksums
        run: Get-ChildItem dist/artifacts -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } | Set-Content dist/artifacts/SHA256SUMS.txt
      - name: Upload verified distributables
        uses: actions/upload-artifact@v4
        with:
          name: windows-distributables
          path: dist/artifacts/*
          if-no-files-found: error
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-verification
          path: |
            build/verification/
            build/packaging/
            build/ScopeZeroSpanConverter/warn-*.txt
          if-no-files-found: warn

  publish:
    needs: build-windows
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-distributables
          path: artifacts
      - name: Create GitHub Release after every validation passed
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
