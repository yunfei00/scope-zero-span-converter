[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scope-zero-span-converter"
version = "0.3.0"
description = "将示波器时域波形离线转换为频谱仪 Zero Span 功率-时间曲线"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "PySide6>=6.7,<6.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
scope-zero-span-converter = "scope_zero_span_converter.cli:main"
scope-zero-span-gui = "scope_zero_span_converter.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
