[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scope-zero-span-converter"
dynamic = ["version"]
description = "示波器时域波形研究、DCM 综合分析与 Zero Span 联动转换工具"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "PySide6>=6.7,<6.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
scope-zero-span-converter = "scope_zero_span_converter.cli:main"
scope-zero-span-gui = "scope_zero_span_converter.app:main"

[tool.setuptools.dynamic]
version = {attr = "scope_zero_span_converter._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
